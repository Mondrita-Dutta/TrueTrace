name: TrueTrace CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Smart Contract Tests
        working-directory: ./blockchain
        run: cargo test --locked

  build:
    name: Build Applications
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Smart Contract
        working-directory: ./blockchain
        run: cargo build --target wasm32-unknown-unknown --release --locked

  deploy_contract:
    name: Deploy Smart Contract
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Stellar CLI
        run: |
          curl -sL https://github.com/stellar/stellar-cli/releases/download/v21.1.1/stellar-cli-21.1.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv stellar-cli-21.1.1-x86_64-unknown-linux-gnu/stellar /usr/local/bin/
          stellar --version

      - name: Deploy Contract
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          chmod +x scripts/deploy_contract.sh
          ./scripts/deploy_contract.sh

      - name: Commit Updated Contract ID
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update deployed contract ID"
          file_pattern: "shared/contract.json"

  deploy_apps:
    name: Deploy Backend & Frontend
    needs: deploy_contract
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend (Placeholder via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "Deploying backend..."
            # cd /path/to/backend
            # git pull origin main
            # npm install
            # pm2 restart server
            
      - name: Deploy Frontend (Placeholder via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "Deploying frontend..."
            # cd /path/to/frontend
            # git pull origin main
            # npm install
            # npm run build
            # cp -r dist/* /var/www/html/

